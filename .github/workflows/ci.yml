name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Emacs ${{ matrix.emacs_version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 29.1 is the version declared in Package-Requires; 30.1 is the
        # current stable series.  "release-snapshot" builds the emacs-31
        # branch (31.0.90 at time of writing) -- the imminent release, so
        # a break there is something to know about now rather than on the
        # day it ships, and it is required to pass like the rest.
        emacs_version: ['29.1', '30.1', 'release-snapshot']
        experimental: [false]
        include:
          # "snapshot" is Emacs master (32.0.50), not 31 -- a far-future
          # canary.  Allowed to fail so churn upstream in a version nobody
          # is running yet does not block this repository.
          - emacs_version: snapshot
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Show Emacs version
        run: emacs --version

      # Deliberately kept in its own job, with nothing compiled first.
      # `-L .` loads donkey.elc in preference to donkey.el when one exists,
      # and byte-code open-codes `delete-region', `forward-char' and
      # `forward-line', which defeats the `cl-letf' mocks several tests use
      # to assert those were called.  Compiling in this job would make those
      # tests fail for reasons that have nothing to do with the change under
      # test.
      - name: Run ERT suite
        run: |
          set -euo pipefail
          test_args=""
          for f in donkey-testing/*-test.el; do
            test_args="$test_args -l $f"
          done
          # shellcheck disable=SC2086
          emacs -Q --batch -L . -L donkey-testing $test_args \
            -f ert-run-tests-batch-and-exit

  isolated:
    name: Tests (each file alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # The suite above loads every file into one Emacs, so a test can pass
      # on state an earlier file left behind and nothing says so.  That is
      # not hypothetical: `donkey--mark-extending-p' compared `last-command'
      # with `this-command' and nothing else, and outside the command loop
      # BOTH are nil -- so a Lisp call with a mark already set was read as a
      # repeat and extended instead of marking.  Any earlier test leaves
      # `last-command' non-nil and hides it, so the combined run was green
      # for as long as the bug existed.  Running each file into its own
      # Emacs is what makes that visible.
      #
      # One version is enough.  What this job tests is independence between
      # files, which is a property of the tests rather than of Emacs, and
      # the matrix above already covers the versions.
      #
      # Every file is run before failing, rather than stopping at the first,
      # so one broken file does not hide the others.
      - name: Run each test file in a fresh Emacs
        run: |
          set -uo pipefail
          failed=""
          for f in donkey-testing/*-test.el; do
            echo "=== $f ==="
            if ! emacs -Q --batch -L . -L donkey-testing \
                 -l "$f" -f ert-run-tests-batch-and-exit; then
              failed="$failed $f"
            fi
          done
          if [ -n "$failed" ]; then
            for f in $failed; do
              echo "::error file=$f::fails when run on its own"
            done
            exit 1
          fi
          echo "every test file passes in isolation"

  smartparens:
    name: Tests (with Smartparens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # Four tests gate on `(featurep 'smartparens)' and had therefore
      # never run anywhere -- not locally, not in CI.  Four tests that
      # never execute are four tests the project does not actually have,
      # and the integration they cover is one DONKEY advertises.
      #
      # Cloned rather than installed from MELPA, which keeps the job to
      # two fixed git checkouts with no package archive, no refresh step
      # and no network dependency beyond GitHub itself.  `dash' is
      # Smartparens' only Package-Requires entry.
      #
      # Pinned to a tag rather than tracking master: this job exists to
      # test DONKEY, and an upstream change breaking the build should be
      # a deliberate bump here rather than a red run on an unrelated PR.
      - name: Fetch Smartparens and dash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.11.0 \
            https://github.com/Fuco1/smartparens.git /tmp/smartparens
          git clone --depth 1 --branch 2.19.1 \
            https://github.com/magnars/dash.el.git /tmp/dash

      # `skip-unless' reports a skip, not a failure, so a suite where
      # Smartparens failed to load would pass here while testing nothing.
      # The count is asserted instead: with it present exactly two tests
      # skip -- `donkey-cg-without-smartparens', which skips BECAUSE it
      # is present, and the one needing `sp-overlay-keymap'.  Any more
      # than that means the integration tests silently went back to
      # skipping.
      - name: Run the suite with Smartparens loaded
        run: |
          set -uo pipefail
          test_args=""
          for f in donkey-testing/*-test.el; do
            test_args="$test_args -l $f"
          done
          # shellcheck disable=SC2086
          emacs -Q --batch -L . -L donkey-testing -L /tmp/dash -L /tmp/smartparens \
            --eval "(require 'smartparens)" $test_args \
            -f ert-run-tests-batch-and-exit 2>&1 | tee /tmp/sp-run.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::suite failed with Smartparens loaded"
            exit 1
          fi
          skipped=$(grep -c '^  SKIPPED' /tmp/sp-run.log || true)
          if [ "$skipped" -gt 2 ]; then
            echo "::error::$skipped tests skipped with Smartparens loaded; expected 2"
            grep '^  SKIPPED' /tmp/sp-run.log
            exit 1
          fi
          echo "suite passes with Smartparens, $skipped skipped as expected"

  shuffled:
    name: Tests (shuffled order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # The job above catches state leaking between FILES.  This catches it
      # between tests: ERT runs in a fixed order, so a test that only passes
      # because of what ran before it stays green forever.
      #
      # Eight tests were doing exactly that when this was first run against
      # a suite that had been green for months -- an unbound `kill-ring', a
      # `current-prefix-arg' left set by `execute-kbd-macro' after a counted
      # key, a `temporary-goal-column' that walked a rectangle to the wrong
      # column, a `this-command' that made a helper run some other command,
      # and `donkey-mode' left on globally.  See donkey-shuffle.el.
      #
      # Fixed seeds rather than a random one, so this job cannot go red on a
      # change that did not cause it.  A seed that fails here reproduces
      # byte for byte locally, since the shuffle is a self-contained LCG.
      # Add a seed when a new order is worth pinning.
      - name: Run the suite in several shuffled orders
        run: |
          set -uo pipefail
          test_args=""
          for f in donkey-testing/*-test.el; do
            test_args="$test_args -l $f"
          done
          failed=""
          for seed in 1 2 3 4 5; do
            # shellcheck disable=SC2086
            if ! emacs -Q --batch -L . -L donkey-testing $test_args \
                 -l donkey-testing/donkey-shuffle.el \
                 --eval "(donkey-shuffle-run $seed)"; then
              failed="$failed $seed"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::suite depends on test order; failing seeds:$failed"
            exit 1
          fi
          echo "suite passes in every shuffled order tried"

  lint:
    name: Byte-compile, checkdoc, package-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'

      # Warnings are errors for the package file.  The test files are not
      # compiled: they carry deliberate unused lambda arguments (mock
      # signatures that must match the real command) and references to
      # optional third-party symbols such as `smartparens-mode-map', which
      # are warnings by nature rather than defects.
      - name: Byte-compile (warnings are errors)
        run: |
          set -euo pipefail
          emacs -Q --batch \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile donkey.el

      # `checkdoc-file' reports by printing; it neither signals nor sets a
      # non-zero exit status, so any output at all has to be treated as the
      # failure signal.
      - name: Checkdoc
        run: |
          set -euo pipefail
          output=$(emacs -Q --batch \
            --eval "(progn (require 'checkdoc) (checkdoc-file \"donkey.el\"))" \
            --eval "(dolist (f (file-expand-wildcards \"donkey-testing/*.el\")) (checkdoc-file f))" 2>&1)
          if [ -n "$output" ]; then
            echo "$output"
            echo "::error::checkdoc reported issues"
            exit 1
          fi
          echo "checkdoc clean"

      - name: Install package-lint
        run: |
          set -euo pipefail
          emacs -Q --batch --eval "(progn \
            (require 'package) \
            (add-to-list 'package-archives \
                         '(\"melpa\" . \"https://melpa.org/packages/\") t) \
            (package-initialize) \
            (package-refresh-contents) \
            (package-install 'package-lint))"

      - name: package-lint
        run: |
          set -euo pipefail
          emacs -Q --batch \
            --eval "(package-initialize)" \
            -l package-lint \
            -f package-lint-batch-and-exit donkey.el
