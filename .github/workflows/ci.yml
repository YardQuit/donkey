name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, so the token should not be able
# to either.  Without this block the GITHUB_TOKEN's reach is whatever the
# repository's default happens to be; with it, every job in this file is
# capped at read whatever that default says.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Emacs ${{ matrix.emacs_version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 29.1 is the version declared in Package-Requires; 30.1 is the
        # current stable series.  "release-snapshot" builds the emacs-31
        # branch (31.0.90 at time of writing) -- the imminent release, so
        # a break there is something to know about now rather than on the
        # day it ships, and it is required to pass like the rest.
        emacs_version: ['29.1', '30.1', 'release-snapshot']
        experimental: [false]
        include:
          # "snapshot" is Emacs master (32.0.50), not 31 -- a far-future
          # canary.  Allowed to fail so churn upstream in a version nobody
          # is running yet does not block this repository.
          - emacs_version: snapshot
            experimental: true
    steps:
      # Pinned to the commit v4 pointed at when audited -- a tag can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: @master executes whatever that branch holds on the day.
      - uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69 # master, audited
        with:
          version: ${{ matrix.emacs_version }}

      - name: Show Emacs version
        run: emacs --version

      # Deliberately kept in its own job, with nothing compiled first.
      # `-L .` loads donkey.elc in preference to donkey.el when one exists,
      # and byte-code open-codes `delete-region', `forward-char' and
      # `forward-line', which defeats the `cl-letf' mocks several tests use
      # to assert those were called.  Compiling in this job would make those
      # tests fail for reasons that have nothing to do with the change under
      # test.
      - name: Run ERT suite
        run: |
          set -euo pipefail
          test_args=""
          for f in donkey-testing/*-test.el; do
            test_args="$test_args -l $f"
          done
          # shellcheck disable=SC2086
          emacs -Q --batch -L . -L donkey-testing $test_args \
            -f ert-run-tests-batch-and-exit

  isolated:
    name: Tests (each file alone)
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit v4 pointed at when audited -- a tag can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: @master executes whatever that branch holds on the day.
      - uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69 # master, audited
        with:
          version: '30.1'

      # The suite above loads every file into one Emacs, so a test can pass
      # on state an earlier file left behind and nothing says so.  That is
      # not hypothetical: `donkey--mark-extending-p' compared `last-command'
      # with `this-command' and nothing else, and outside the command loop
      # BOTH are nil -- so a Lisp call with a mark already set was read as a
      # repeat and extended instead of marking.  Any earlier test leaves
      # `last-command' non-nil and hides it, so the combined run was green
      # for as long as the bug existed.  Running each file into its own
      # Emacs is what makes that visible.
      #
      # One version is enough.  What this job tests is independence between
      # files, which is a property of the tests rather than of Emacs, and
      # the matrix above already covers the versions.
      #
      # Every file is run before failing, rather than stopping at the first,
      # so one broken file does not hide the others.
      - name: Run each test file in a fresh Emacs
        run: |
          set -uo pipefail
          failed=""
          for f in donkey-testing/*-test.el; do
            echo "=== $f ==="
            if ! emacs -Q --batch -L . -L donkey-testing \
                 -l "$f" -f ert-run-tests-batch-and-exit; then
              failed="$failed $f"
            fi
          done
          if [ -n "$failed" ]; then
            for f in $failed; do
              echo "::error file=$f::fails when run on its own"
            done
            exit 1
          fi
          echo "every test file passes in isolation"

  smartparens:
    name: Tests (with Smartparens)
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit v4 pointed at when audited -- a tag can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: @master executes whatever that branch holds on the day.
      - uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69 # master, audited
        with:
          version: '30.1'

      # Four tests gate on `(featurep 'smartparens)' and had therefore
      # never run anywhere -- not locally, not in CI.  Four tests that
      # never execute are four tests the project does not actually have,
      # and the integration they cover is one DONKEY advertises.
      #
      # Cloned rather than installed from MELPA, which keeps the job to
      # two fixed git checkouts with no package archive, no refresh step
      # and no network dependency beyond GitHub itself.  `dash' is
      # Smartparens' only Package-Requires entry.
      #
      # Pinned to a tag rather than tracking master: this job exists to
      # test DONKEY, and an upstream change breaking the build should be
      # a deliberate bump here rather than a red run on an unrelated PR.
      #
      # And verified by COMMIT after fetching, because a tag is a mutable
      # pointer: whoever controls the upstream repository can move it,
      # and this job executes whatever Emacs Lisp it lands on.  The tag
      # is the human-readable request; the hash is the contract.  A
      # deliberate version bump updates both, side by side.
      - name: Fetch Smartparens and dash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.11.0 \
            https://github.com/Fuco1/smartparens.git /tmp/smartparens
          git clone --depth 1 --branch 2.19.1 \
            https://github.com/magnars/dash.el.git /tmp/dash
          expect_sp=4873352b5d0a1c5142658122de1b6950b8fe7e4d
          # dash's 2.19.1 is an ANNOTATED tag: `ls-remote' shows the tag
          # object's hash, while the checkout lands on the commit it points
          # to.  The commit is what executes, so the commit is what is
          # pinned -- resolved via ls-remote's peeled 'refs/tags/2.19.1^{}'.
          expect_dash=39d067b9fbb2db65fc7a6938bfb21489ad990cb4
          got_sp=$(git -C /tmp/smartparens rev-parse HEAD)
          got_dash=$(git -C /tmp/dash rev-parse HEAD)
          if [ "$got_sp" != "$expect_sp" ] || [ "$got_dash" != "$expect_dash" ]; then
            echo "::error::upstream tag moved: smartparens $got_sp (want $expect_sp), dash $got_dash (want $expect_dash)"
            exit 1
          fi

      # `skip-unless' reports a skip, not a failure, so a suite where
      # Smartparens failed to load would pass here while testing nothing.
      # The count is asserted instead: with it present exactly ONE test
      # skips -- `donkey-cg-without-smartparens', which skips BECAUSE it
      # is present.  Any more than that means the integration tests
      # silently went back to skipping.
      #
      # The budget was two until the second skipper was looked at: it
      # gated on `sp-overlay-keymap', which is bound nowhere in
      # Smartparens 1.11.0, so it could never run in the very job built
      # to run it and the branch it covered went untested.  A budget with
      # room in it hides exactly this, so there is no room now.
      - name: Run the suite with Smartparens loaded
        run: |
          set -uo pipefail
          test_args=""
          for f in donkey-testing/*-test.el; do
            test_args="$test_args -l $f"
          done
          # shellcheck disable=SC2086
          emacs -Q --batch -L . -L donkey-testing -L /tmp/dash -L /tmp/smartparens \
            --eval "(require 'smartparens)" $test_args \
            -f ert-run-tests-batch-and-exit 2>&1 | tee /tmp/sp-run.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::suite failed with Smartparens loaded"
            exit 1
          fi
          skipped=$(grep -c '^  SKIPPED' /tmp/sp-run.log || true)
          if [ "$skipped" -gt 1 ]; then
            echo "::error::$skipped tests skipped with Smartparens loaded; expected 1"
            grep '^  SKIPPED' /tmp/sp-run.log
            exit 1
          fi
          echo "suite passes with Smartparens, $skipped skipped as expected"

  shuffled:
    name: Tests (shuffled order)
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit v4 pointed at when audited -- a tag can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: @master executes whatever that branch holds on the day.
      - uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69 # master, audited
        with:
          version: '30.1'

      # The job above catches state leaking between FILES.  This catches it
      # between tests: ERT runs in a fixed order, so a test that only passes
      # because of what ran before it stays green forever.
      #
      # Eight tests were doing exactly that when this was first run against
      # a suite that had been green for months -- an unbound `kill-ring', a
      # `current-prefix-arg' left set by `execute-kbd-macro' after a counted
      # key, a `temporary-goal-column' that walked a rectangle to the wrong
      # column, a `this-command' that made a helper run some other command,
      # and `donkey-mode' left on globally.  See donkey-shuffle.el.
      #
      # Fixed seeds rather than a random one, so this job cannot go red on a
      # change that did not cause it.  A seed that fails here reproduces
      # byte for byte locally, since the shuffle is a self-contained LCG.
      # Add a seed when a new order is worth pinning.
      - name: Run the suite in several shuffled orders
        run: |
          set -uo pipefail
          test_args=""
          for f in donkey-testing/*-test.el; do
            test_args="$test_args -l $f"
          done
          failed=""
          # 20260823: the first order that ran the org link test cold,
          # exposing a cl-letf stub over an autoload cell (see the
          # browse-url require in donkey-org-integration-test.el).
          for seed in 1 2 3 4 5 20260823; do
            # shellcheck disable=SC2086
            if ! emacs -Q --batch -L . -L donkey-testing $test_args \
                 -l donkey-testing/donkey-shuffle.el \
                 --eval "(donkey-shuffle-run $seed)"; then
              failed="$failed $seed"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::suite depends on test order; failing seeds:$failed"
            exit 1
          fi
          echo "suite passes in every shuffled order tried"

  # The suite in a REAL terminal frame, which is the kind of frame this
  # package is for and the kind every other job here lacks.  --batch has
  # no window, no command loop of the usual shape, and different error
  # propagation inside `execute-kbd-macro' -- so a test can pass in every
  # job above and still fail the first time a person runs it.
  #
  # Two did.  `donkey-tutor-lesson-2-tells-the-truth-about-bare-digits'
  # drove "3 j" as one macro: a running macro aborts at the `undefined'
  # error in a terminal frame, so the motion never ran, while a reader
  # typing two keys types two COMMANDS and gets the line the lesson
  # promises.  `...at-end-of-line-appends-via-change' called `next-line'
  # straight from Lisp, which lands on column 0 there rather than the
  # column `end-of-line' put point on, so the rectangle spanned whole
  # lines and the change replaced them.  Both were fixed by driving keys;
  # neither was a defect in the commands, and neither was visible from
  # any job that runs --batch.
  #
  # `script' supplies the pty Emacs needs to open a terminal frame at all.
  terminal:
    name: Suite in a terminal frame (-nw)
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit v4 pointed at when audited -- a tag can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: @master executes whatever that branch holds on the day.
      - uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69 # master, audited
        with:
          version: '30.1'

      # `ert-run-tests-batch-and-exit' cannot be used outside --batch: its
      # output goes to the echo area rather than to stdout, so a failing
      # run would scroll past invisibly and this job would pass while
      # reporting nothing.  Messages are captured to a file instead, and
      # the exit status is taken from the stats object rather than by
      # grepping that file -- a grep would also match a test NAME
      # containing the word, and the point of this job is to fail when it
      # should.
      - name: Write the terminal-frame driver
        run: |
          set -euo pipefail
          cat > /tmp/nw-driver.el <<'ELISP'
          (require 'ert)
          (dolist (f (file-expand-wildcards
                      (expand-file-name "donkey-testing/*-test.el"
                                        default-directory)))
            (load f nil t))
          (let ((log "") stats)
            (cl-letf (((symbol-function 'message)
                       (lambda (fmt &rest args)
                         (when fmt
                           (setq log (concat log (apply #'format fmt args) "\n"))))))
              (setq stats (ert-run-tests-batch t)))
            (with-temp-file "/tmp/nw-run.log" (insert log))
            (kill-emacs (if (zerop (ert-stats-completed-unexpected stats)) 0 1)))
          ELISP

      - name: Run the suite in a terminal frame
        run: |
          set -uo pipefail
          TERM=xterm-256color script -qec \
            "emacs -nw -Q -L . -L donkey-testing -l /tmp/nw-driver.el" /dev/null \
            > /dev/null 2>&1
          status=$?
          tail -n 40 /tmp/nw-run.log || true
          if [ "$status" -ne 0 ]; then
            echo "::error::suite failed in a terminal frame"
            grep -E '^ *FAILED' /tmp/nw-run.log || true
            exit 1
          fi
          grep -E '^Ran ' /tmp/nw-run.log

  lint:
    name: Byte-compile, checkdoc, package-lint
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit v4 pointed at when audited -- a tag can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: @master executes whatever that branch holds on the day.
      - uses: purcell/setup-emacs@1f1e9c315c2e3312705e920ae1ddd7e0e2b13c69 # master, audited
        with:
          version: '30.1'

      # Warnings are errors for the package file.  The test files are not
      # compiled: they carry deliberate unused lambda arguments (mock
      # signatures that must match the real command) and references to
      # optional third-party symbols such as `smartparens-mode-map', which
      # are warnings by nature rather than defects.
      - name: Byte-compile (warnings are errors)
        run: |
          set -euo pipefail
          emacs -Q --batch \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile donkey.el

      # `checkdoc-file' reports by printing; it neither signals nor sets a
      # non-zero exit status, so any output at all has to be treated as the
      # failure signal.
      - name: Checkdoc
        run: |
          set -euo pipefail
          output=$(emacs -Q --batch \
            --eval "(progn (require 'checkdoc) (checkdoc-file \"donkey.el\"))" \
            --eval "(dolist (f (file-expand-wildcards \"donkey-testing/*.el\")) (checkdoc-file f))" 2>&1)
          if [ -n "$output" ]; then
            echo "$output"
            echo "::error::checkdoc reported issues"
            exit 1
          fi
          echo "checkdoc clean"

      # Cloned at a pinned commit rather than installed from MELPA, for
      # the same reason the Smartparens job clones: the archive serves
      # whatever it built most recently, this job executes it, and a
      # lint run should not change meaning -- or content -- between two
      # pushes of the same tree.  It also drops the archive-refresh
      # network dependency, which has been this job's only flaky part.
      - name: Fetch package-lint
        run: |
          set -euo pipefail
          git clone https://github.com/purcell/package-lint.git /tmp/package-lint
          git -C /tmp/package-lint checkout --quiet 35996f478d81e51dae4fa30d051f741895d07399
          got=$(git -C /tmp/package-lint rev-parse HEAD)
          if [ "$got" != "35996f478d81e51dae4fa30d051f741895d07399" ]; then
            echo "::error::package-lint checkout mismatch: $got"
            exit 1
          fi

      - name: package-lint
        run: |
          set -euo pipefail
          emacs -Q --batch \
            -L /tmp/package-lint \
            -l package-lint \
            -f package-lint-batch-and-exit donkey.el
